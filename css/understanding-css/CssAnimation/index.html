<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-5 flex flex-col gap-6">
    <!-- TRANSFORM -->

     <div class="flex gap-6 items-center">
        <div class="bg-blue-500 text-white text-xs p-4 rounded translate-y-4">translate</div>
        <div class="bg-blue-500 text-white text-xs p-4 rounded rotate-12">rotate 12</div>
        <div class="bg-blue-500 text-white text-xs p-4 rounded scale-125">scale-125</div>
        <div class="bg-blue-500 text-white text-xs p-4 rounded skew-y-6">skew-y-6</div>


        <!-- Transform origin -->

         <div class="bg-blue-500 text-white text-xs p-4 rounded origin-top-left rotate-12">rotate 12</div>
         <div class="bg-blue-500 text-white text-xs p-4 rounded origin-bottom-left scale-[1.25]  ">scale 125</div>

              <!-- combininig multiple transform on an element -->

<div style="transform: translateX(40px) rotate(20deg); ">
A
</div>
<div style="transform: rotate(20deg) translateX(40px);">
B
</div>

</div>


<!-- Transform Examples -->

<div class="flex flex-col gap-4">


    <!-- Zoom on hover card -->
     <div class="relative w-64 h-49 overflow-hidden rounded-lg bg-blue-100">

        </span>
        <span class="absolute h-0.5 w-full bg-slate-800 top-1/2 transition-opacity duration-300 group-hover:opacity-0">

        </span>
        <span class="absolute h-0.5 w-full bg-slate-800 bottom-0 transition-transform duration-300 origin-center group-hover:-rotate-45 group-hover:bottom-1/2">

        </span>
     </button>

<!-- 3D perspective Tilt (rotateX/rotateY) -->
 <div class="[perspective:800px]">
    <div class="bg-blue-600 text-white p-6 rounded-lg transition-transform duration-300 hover:[transform:rotateX(10deg)_rotateY(-10deg)]">3D Tilt</div>

 </div>

</div>

<!-- TRANSITION -->
<!-- transition: <property> <duration> <timing-functon> <delay> -->

    <!-- 
    - transition-property: specifies the css propertybtp which the transition is applied.
    
    - transition-duration: specifies the duration of te transition
    
    - transition-timing and function: specifies the speed of the curve of the transition (ease, linear, ease-in, ease out,ease-in-out)

    - transition-delay: specifies the delay before the transition starts (0s default, 200ms stagger)
     -->
<div class="flex flex-col gap-4">
    <!-- choosing what to transition -->
<button class="bg-blue-600 text-white px-4 py-2 rounded duration-300 transition-all hover:bg-blue-800 hover:scale-105 hover:shadow-lg">
Transition All
</button>
<button class="bg-blue-600 text-white px-4 py-2 rounded duration-300 transition-colors hover:bg-blue-800 hover:scale-105">
Transition Colors
</button>

<!-- transition timing-functon -->
<div class="group space-y-5 p-4">

    <div class="w-16 h-4 bg-blue-500 rounded transition-transform duration-700  group-hover:translate-x-48 ease-linear">

</div>

<div class="w-16 h-4 bg-blue-500 rounded transition-transform duration-700 group-hover:translate-x-48 ease-in"> 

</div>

<div class="w-16 h-4 bg-blue-500 rounded transition-transform duration-700 group-hover:translate-x-48 ease-out">

</div>

<div class="w-16 h-4 bg-blue-500 rounded transition-transform duration-700 group-hover:translate-x-48 ease-in-out">
</div>
</div>


<!-- Transition Delay -->

<div class="group flex gap-2">
<span class="w-3 h-3 bg-blue-500 rounded-full transition-transform duration-300 group-hover:-translate-y-2 delay-0">

</span>
<span class="w-3 h-3 bg-blue-500 rounded-full transition-transform duration-300 group-hover:-translate-y-2 delay-100">

</span>
<span class="w-3 h-3 bg-blue-500 rounded-full transition-transform duration-300 group-hover:-translate-y-2 delay-200">

</span>
</div>

<!-- Transition Examples -->
<!-- Button with layered hover feedbacks -->
 <button class="bg-slate-900 text-white px-6 py-3 rounded-lg transition-all duration-200 ease-out hover:bg-slate-700 hover:-translate-y-0.5 hover:shadow-lg active:translate-y-0 active:shadow-none">

What is Included

</button>
<div class="max-h-0 overflow-hidden transition-all duration-300 ease-in-out">
    <p class="px-4 pb-4 text-sm text-slate-600">
        Everything is the basic plan, plus priority support and unlimited exports
    </p>
</div>
</div>
</div>

<!-- ANIMATION -->
 <!--
- animation: <name> <duration> <timing-function <delay> <iteration-count> <direction> <fill-mode> <play-state>-->
<!-- -animation-name: specifies the name of the @keyframes animation to apply 

- animation-duration: specifies the duration of yhe animation (300ms, 0.3s)

- animation-timing-function: same easing curves as transition

- animation-delay: waut before starting.

- itearation-count: how many times tpo repeat the animation (infinite, 1, 2, etc)

- direction: normal, reverse, alternate, alternate-reverse

- fill-mode: what state to hold before and after the animation (none, forwards, backwards, both)

- playp-state: running, paused.
-->


<!-- 
 Keyframes are CSS rules that defines the intermediate steps in CSS animation.
-->

<!-- 
- If a keyframe is jsut two steps, it can be defined from and to keywords. or 0% and 100% percentages.

- If a keyframe has more than two steps, it can be defined using percentages (0%, 25% 50%, 75%, 100%) to specify the intermediate states of the animation
-->


Tailwing built in Animations
<div class="flex gap-6 items-center">

    <div class="w-8 h-8 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
<div class="w-8 h-8 rounded-full bg-blue-500 animate-bounce"></div>
<div class="w-8 h-8 rounded-full bg-blue-500 animate-pulse"></div>
<div class="w-8 h-8 rounded-full bg-blue-500 animate-ping"></div>
</div>

<div class="space-y-3 w-64">
<div class="h-4 bg-slate-200 rounded animate-pulse"></div>
<div class="h-4 bg-slate-200 rounded animate-pulse w-5/6"></div>
<div class="h-4 bg-slate-200 rounded animate-pulse w-2/3"></div>
</div>



<p>Customize Animation (Specified using @keyframes)</p>

<button class="bg-red-600 text-white py-4 px-2 rounded" onclick="this.classList.add ('shake'); setTimeout(()=> this.classList.remove('shake'),500);">
    Submit
</button>

<style>
@keyframes shake {
    0%,100%{
        transform: translateX(0)
    }
    10%,30%,50%,90%{
        transform: translateX(-6px);
    }
    20%,40%,60%,80%{
        transform: translateX(6px);
    }
}
.shake{
    animation: shake 500ms ease-in-out;
}
</style>


<div class="loader w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full"></div>

<style>
    @keyframes spin{
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes pulse-opacity{
0%, 100%{
    opacity: 1;
}
50%{
    opacity: 0.4
}
    }
.loader{
    animation: spin 1.2s linear infinite, pulse-opacity 2s ease-in-out infinite;
}
</style>
</body>
