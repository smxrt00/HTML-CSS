<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <script src="https://cdn.Tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- container -->
<main class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-10">
<!-- Responsive Texts -->
<h1 class="mb-6 text-2xl font-bold sm:text-3xl lg:text-5xl">
    Responsive Design with Tailwind CSS
</h1>

<!-- Responsive Grid -->
<!-- Mobile: 1 column
sm: 2 columns 
lg: 4 columns
-->
<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <div class="rounded-lg bg-white p-5 shadow hover:bg-blue-100 transition-all duration-300">
        Card 1
    </div>
    <div class="rounded-lg bg-white p-5 shadow">Card 2</div>
    <div class="rounded-lg bg-white p-5 shadow">Card 3</div>
    <div class="rounded-lg bg-white p-5 shadow">Card 4</div>
</div>


<!-- Resposive flex -->
<!-- 
Mobile column
 md: and above: row
-->
 <div class="mt-8 flex flex-col gap-4 rounded-lg bg-white p-5 md:flex-row">
    <button class="w-full rounded-lg bg-blue-600 px-4 py-2 text-white md:w-auto">
        Button 1
    </button>
    <button class="w-full rounded-lg bg-blue-600 px-4 py-2 text-white md:w-auto">
        Button 2
    </button>
 </div>

 <!-- Responsive Width -->
  <div class="mt-8 w-full rounded bg-blue-100 p-5 md:w-1/2 lg:w-1/3">
    Responsive width: Full widt on mobile, half width on medium screens, and one-third width on lRGE screen
  </div>

  <!-- Responsive Visibility -->
   <!-- visible on mobile, hidden on md+ -->
    <p class="mt-8 md:hidden">
        📱 Mobile screen
    </p>
    <!-- Hidden on mobile, visible on md+ -->
    <p class="mt-8 md:block">
       💻 Desktop Screen 
    </p>
    </main>
</body>
</html>
