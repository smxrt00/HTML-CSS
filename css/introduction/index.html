<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introduction to CSS</title>
    <link rel="stylesheet" href="style.css">
    <style>
        h2{
            font-size: 20px;
            color: darkgreen;
        }
        p{
            font-size: 16px;
            color: darkblue;
        }
    </style>
  </head>
  <body>
    <!--Inline CSS - written directly inside the HTML using the style attributes-->
    <h1 style="font-size: 29px; color: brown">Introduction to CSS</h1>
    <p style="font-size:14px; color: chocolate;">
        CSS (cascading Style Sheets) is a stylesheet language used to describe the presenytation of a document written in HTML
    </p>
    <!--Internal CSS - written inside the <style> tags in the <head> section-->
       <div>
         <h2>Internal CSS</h2>
         <p>This is a paragraph styled with internal CSS</p>
       </div>

       <!--External CSS - written in a seperate css file and linked to the HTML document-->
       <div>
        <h3>External CSS</h3>
        <p>This is a paragraph styled with extrnal CSS.</p>
       </div>
  </body>
</html>
