<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="box" style="width: 50%;">
        <h2>Hello there</h2>
    </div>
    
    <!-- Flexbox -->
     <!-- Flexbox is used to arange elements in a direction. This is a one way dimension. -->
     <div class="container">
        <div class="child">Box 1</div>
        <div class="child">Box 2</div>
        <div class="child">Box 3</div>
        <div class="child">Box 4</div>
        <div class="child">Box 5</div>
        <div class="child">Box 6</div>
     </div>


     <!-- Grid -->
      <!-- This is used to arrange elements both in rows and in columns. It is a two way diemnsiion  -->
       <div class="container2">
        <div class="child2">Box 1</div>
        <div class="child2">Box 2</div>
        <div class="child2">Box 3</div>
        <div class="child2">Box 4</div>
        <div class="child2">Box 5</div>
        <div class="child2">Box 6</div>
       </div>

       <!-- Class work -->
        <div class="container3">
        <div class="child3">Box 1</div>
        <div class="child3">Box 2</div>
        <div class="child3">Box 3</div>
        <div class="child3">Box 4</div>
        <div class="child3">Box 5</div>
        <div class="child3">Box 6</div>
       </div>
</body>
</html>
