    <h2>Pseudo Classes And Elements</h2>
    <!-- Types of Pseudo classes -->
     <!-- <p>:Hover: Apply the style when the user moves their mouse over the elemnt</p>
     <p>:Focus: Applynthe style when the element is focused</p>
     <p>:Active: Apply the style when the element is being activated or pressed </p>
     <p>:Visited: Apply when the element is visited (for links)</p>
     <p>:first-child: Apply the style to the first child element</p>
     <p>:Last-child: Apply the child to the last child of the element</p>
     <p>:nth-child (n): Apply the style to the nth child element</p>
     <p>:not(selector): Apply the style to the element thtatdo not match the selector</p>
     <p>:disabled: Apply the style tp disabled elements</p> -->


     <!-- Brief Example -->
      <button>Click Me</button>
      <input type="text" placeholder="Type something">

      <a href="#">This is a link</a>

      <ul>
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
        <li>Fourth item</li>
      </ul>

<!-- Pseudo elements -->
<!-- Pseudo elements are used to style specific parts of an elements or insert content before or after an element without adding another HTML elements -->
<!-- Common Pseudo elements -->
 <!-- ::before: Insert content before the element
 ::after: Insert content after the element
 ::first-letter: Style the first letter of the element
 ::first-line: Style the first line of the element
 ::selection: Style the portion of the element that is selected by the user
 ::placeholder: style the placeholder text of an input or text area element
 ::matrker: Style the marker of a list item -->

<div class="box">This is a div</div>
<p class="new">This is a paragraph with some text.
    <p class="old">This is another paragraph</p>
</p>
