<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block Elements</title>
</head>
<body>
    <!--Block elements-->
    <p>This is a paraghraph element (block-level)</p>
    <div>This is a div element (block-level).</div>

    <!--Inline elements-->
    <span>This is a span element (inline).</span>
    <a href="#">This is an anchor element (inline).</a>
    <strong>This is a strong element (inline).</strong>
    <em>This is an em element (inline).</em>
</body>
</html>
